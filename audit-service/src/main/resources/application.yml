server:
  port: 8085

spring:
  application:
    name: audit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/audit_db}
    username: ${SPRING_DATASOURCE_USERNAME:finguard}
    password: ${SPRING_DATASOURCE_PASSWORD:finguard}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: audit
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    schemas: audit
    default-schema: audit
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: audit-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.Map
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:finguard-super-secret-jwt-key-for-dev-use-only-32chars}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.finguard: INFO

server:
  port: 8083
  error:
    include-message: never

spring:
  application:
    name: fraud-detection-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fraud_db}
    username: ${SPRING_DATASOURCE_USERNAME:fraud_svc}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: fraud
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    schemas: fraud
    default-schema: fraud
  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # password: SPRING_DATA_REDIS_PASSWORD
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
    properties:
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
    consumer:
      group-id: fraud-detection-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: java.util,java.lang
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap

finguard:
  security:
    oidc:
      # No defaults: the service refuses to start without knowing whom to trust.
      issuer: ${OIDC_ISSUER}
      jwk-set-uri: ${OIDC_JWK_SET_URI}
      audience: finguard-api
  fraud:
    decision:
      review-threshold: 40
      block-threshold: 70
      # REVIEW or BLOCK: what happens when a rule cannot be evaluated
      on-rule-failure: ${FRAUD_ON_RULE_FAILURE:REVIEW}
    rule-config-refresh-interval: 30s
    rules:
      high-amount:
        default-threshold: ${FRAUD_RULE_HIGH_AMOUNT_THRESHOLD:10000}
        thresholds:
          USD: 10000
          EUR: 9000
          GBP: 8000
          CHF: 9000
      velocity:
        max-transactions: ${FRAUD_RULE_VELOCITY_MAX_TX:5}
        window: ${FRAUD_RULE_VELOCITY_WINDOW:10m}
      structuring:
        window: 24h
        min-transactions: 3
      country-change:
        memory: 30d
      night-activity:
        start-hour: 0
        end-hour: 5
        zone: UTC
      suspicious-merchant:
        categories: GAMBLING,CRYPTO,ADULT
      new-device:
        memory: 90d
        treat-missing-as-risky: true
      repeated-blocked:
        lookback: 24h
        min-count: 1

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

logging:
  level:
    com.finguard: INFO

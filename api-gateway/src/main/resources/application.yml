server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Spring Cloud Gateway 4.3+ moved the server properties under server.webflux.
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 30s
            pool:
              # Pooled connections must be dropped before the services' Tomcat closes them
              # (keep-alive timeout 20 s, see server.tomcat in the services); otherwise the
              # gateway reuses a connection the service is closing: "Connection prematurely
              # closed BEFORE response", returned to the client as 500.
              max-idle-time: 10s
              max-life-time: 60s
              eviction-interval: 5s
          globalcors:
            cors-configurations:
              '[/**]':
                # The frontend is served from the same origin via nginx; this only matters for other origins.
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,Idempotency-Key,X-Correlation-Id,X-Device-Id,If-Match
                exposed-headers: X-Correlation-Id,Idempotent-Replayed,Retry-After,ETag
                allow-credentials: true
                max-age: 3600
          default-filters:
            - SecureHeaders
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
          routes:
            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/transactions/**,/api/transactions,/api/accounts/**,/api/accounts
            - id: fraud-service
              uri: ${FRAUD_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/fraud/**
            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/audit/**
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
    properties:
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
    consumer:
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: java.util,java.lang
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap

finguard:
  security:
    oidc:
      issuer: ${OIDC_ISSUER}
      jwk-set-uri: ${OIDC_JWK_SET_URI}
      audience: finguard-api
  gateway:
    trust-proxy-headers: ${GATEWAY_TRUST_PROXY_HEADERS:false}
    sse-heartbeat: 15s

logging:
  level:
    com.finguard: INFO
    org.springframework.cloud.gateway: WARN

# Metrics for Prometheus (scraped inside the docker network; nginx does not proxy /actuator).
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets, so Prometheus can compute p95/p99 across instances.
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="297px" preserveAspectRatio="none" style="width:1153px;height:297px;background:#FFFFFF;" version="1.1" viewBox="0 0 1153 297" width="1153px" zoomAndPan="magnify"><defs/><g><g id="New"><rect fill="#EAF1FB" height="64.8462" rx="5" ry="5" style="stroke:#3D6DB5;stroke-width:0.5;" width="117.5698" x="87" y="227"/><line style="stroke:#3D6DB5;stroke-width:0.5;" x1="87" x2="204.5698" y1="251.9487" y2="251.9487"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="72.2744" x="109.6477" y="244.1938">Unpublished</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="86.7026" x="92" y="269.1426">written with the</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="97.5698" x="92" y="284.0913">business change</text></g><g id="Retry"><rect fill="#EAF1FB" height="64.8462" rx="5" ry="5" style="stroke:#3D6DB5;stroke-width:0.5;" width="197.0425" x="360" y="67"/><line style="stroke:#3D6DB5;stroke-width:0.5;" x1="360" x2="557.0425" y1="91.9487" y2="91.9487"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="91.7427" x="412.6499" y="84.1938">Waiting for retry</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="75.5117" x="365" y="109.1426">attempts + 1,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="177.0425" x="365" y="124.0913">nextAttemptAt = now + backoff</text></g><g id="Published"><rect fill="#EAF1FB" height="50" rx="5" ry="5" style="stroke:#3D6DB5;stroke-width:0.5;" width="108.8926" x="742" y="234.5"/><line style="stroke:#3D6DB5;stroke-width:0.5;" x1="742" x2="850.8926" y1="259.4487" y2="259.4487"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="57.0972" x="767.8977